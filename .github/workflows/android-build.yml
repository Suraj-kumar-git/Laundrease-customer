name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, dev-android]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "www/**"
      - "package.json"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Keyed on package-lock.json, which is why this only works now that
          # the lockfile is committed.
          cache: npm

      # npm ci, not npm install: it installs the locked tree exactly and fails
      # if package-lock.json has drifted from package.json, so the artifact is
      # built from the dependency set that was actually tested.
      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: laundrease-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
