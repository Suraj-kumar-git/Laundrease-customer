name: Build Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName to stamp (e.g. 1.0.0). Defaults to the run number."
        required: false
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Keyed on package-lock.json, which is why this only works now that
          # the lockfile is committed.
          cache: npm

      # npm ci, not npm install: it installs the locked tree exactly and fails
      # if package-lock.json has drifted from package.json, so the artifact is
      # built from the dependency set that was actually tested.
      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # The keystore is stored as base64 because GitHub secrets are text-only.
      # It lands outside the workspace so it can never be picked up by a later
      # step that archives or uploads the checkout.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce a signed build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            NAME="${{ inputs.version_name }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$NAME versionCode=${GITHUB_RUN_NUMBER}"

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      # A release artifact that came out unsigned means build.gradle could not
      # see the keystore — fail loudly here rather than shipping it to Play.
      - name: Verify the artifacts are signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB (Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: laundrease-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK (direct install / testers)
        uses: actions/upload-artifact@v4
        with:
          name: laundrease-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
