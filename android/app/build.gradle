apply plugin: 'com.android.application'

// --- Release signing -------------------------------------------------------
// Credentials come from android/keystore.properties for local release builds,
// or from environment variables in CI. Both are untracked (see .gitignore) —
// the keystore and its passwords must never enter the repo.
//
// When neither source is present (debug builds, forks, PRs without secrets)
// no release signingConfig is created at all, so `assembleDebug` keeps working
// and `assembleRelease` produces an unsigned artifact rather than failing the
// whole configuration phase with a missing-file error.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProps.load(it) }
}

def signingStorePath = keystoreProps['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = keystoreProps['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = keystoreProps['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = keystoreProps['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = signingStorePath != null && file(signingStorePath).exists()

// --- Versioning ------------------------------------------------------------
// Play rejects any upload whose versionCode is not strictly greater than the
// previous one, so CI feeds in the workflow run number. versionName is the
// release tag with its leading 'v' stripped. The fallbacks below only apply to
// local builds, which never reach Play.
def buildVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: '1') as Integer
def buildVersionName = System.getenv('ANDROID_VERSION_NAME') ?: '1.0'

android {
    namespace = "in.laundrease.customer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.laundrease.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingStorePath)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // PayU CheckoutPro — the native payment sheet, wrapped by
    // PayUCheckoutPlugin.java. The official Cordova plugin cannot be used
    // here: Cordova plugin JS is injected from local assets, which never
    // happens when Capacitor loads a remote server.url (see
    // capacitor.config.ts), so we bind the Android SDK directly instead.
    implementation 'in.payu:payu-checkout-pro:3.3.15'
    // UPI intent hand-off to the installed GPay / PhonePe apps. Without
    // these two, UPI stays inside the SDK's own collect flow and the
    // app-switch customers expect does not happen.
    implementation 'in.payu:payu-gpay:4.0.4'
    implementation 'in.payu:phonepe-intent:1.8.11'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
