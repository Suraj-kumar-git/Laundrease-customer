// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // PhonePe publishes IntentSDK only to its own repo, and
        // in.payu:phonepe-intent depends on it transitively, so a Central-only
        // build fails to resolve it.
        //
        // Scoped with includeGroup on purpose: an unscoped third-party repo
        // gets queried for *every* dependency, which both slows resolution and
        // means a compromised or typo-squatted artifact there could answer for
        // a coordinate we meant to fetch from Central.
        maven {
            url 'https://phonepe.mycloudrepo.io/public/repositories/phonepe-intentsdk-android'
            content {
                includeGroup 'phonepe.intentsdk.android.release'
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
